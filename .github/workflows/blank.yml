name: Wayback JS & Sensitive Scanner

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Target domain (example: 8x8.com)"
        required: true
        default: "example.com"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run JS Scanner
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          mkdir -p output
          python scan_js.py

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: js-scan-results
          path: output/

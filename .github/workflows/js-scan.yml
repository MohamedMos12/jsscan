name: JS Wayback Scanner

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Target domain (example: 8x8.com)"
        required: true
        default: "example.com"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run JS Scanner
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          python scan_js.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: js-scan-results
          path: output/
